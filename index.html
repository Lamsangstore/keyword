<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>LAMSANG — คีย์ลัด</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    :root {
      --ink:     #1a1a2e;
      --ink2:    #2d2d4e;
      --surface: #ffffff;
      --glass:   rgba(255,255,255,0.72);
      --pink:    #ff3b6b;
      --pink2:   #ff6b9d;
      --gold:    #c9a84c;
      --muted:   #8e8ea0;
      --pale:    #f5f4fa;
      --border:  rgba(0,0,0,0.07);
      --r:       20px;
      --ease:    cubic-bezier(.22,1,.36,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{font-size:16px;scroll-behavior:smooth}
    body{
      background:var(--pale);
      font-family:'Prompt',sans-serif;
      color:var(--ink);
      min-height:100vh;
      overflow-x:hidden;
    }

    /* ── BACKGROUND BLOBS ── */
    body::before{
      content:'';
      position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 80vw 60vh at 20% -10%, rgba(255,59,107,.10) 0%, transparent 60%),
        radial-gradient(ellipse 60vw 50vh at 90% 100%, rgba(201,168,76,.08) 0%, transparent 60%),
        radial-gradient(ellipse 50vw 50vh at 60% 50%, rgba(130,80,255,.04) 0%, transparent 60%);
      pointer-events:none;
    }

    /* ── APP STORE TOPBAR ── */
    .as-topbar{
      position:sticky;top:0;z-index:200;
      background:rgba(18,18,30,.92);
      backdrop-filter:blur(24px) saturate(200%);
      -webkit-backdrop-filter:blur(24px) saturate(200%);
      padding:12px 18px 10px;
      display:flex;align-items:center;gap:14px;
      border-bottom:1px solid rgba(255,255,255,.07);
      box-shadow:0 2px 20px rgba(0,0,0,.25);
    }
    .as-logo{
      width:36px;height:36px;flex-shrink:0;
      border-radius:10px;overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    .as-logo img{width:100%;height:100%;object-fit:cover;display:block}
    .as-brand{
      font-size:1.15em;font-weight:800;
      color:#fff;letter-spacing:-0.01em;
      white-space:nowrap;
    }
    .as-search{
      flex:1;
      display:flex;align-items:center;gap:8px;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      padding:8px 14px;
      cursor:text;
      transition:background .2s;
    }
    .as-search:focus-within{background:rgba(255,255,255,.15)}
    .as-search-icon{font-size:.9em;opacity:.5;flex-shrink:0}
    .as-search input{
      background:none;border:none;outline:none;
      width:100%;
      font-family:'Prompt',sans-serif;
      font-size:.85em;font-weight:500;
      color:#fff;
    }
    .as-search input::placeholder{color:rgba(255,255,255,.4)}
    .as-settings{
      width:34px;height:34px;flex-shrink:0;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:1em;cursor:pointer;
      text-decoration:none;
      transition:background .2s;
    }
    .as-settings:hover{background:rgba(255,255,255,.18)}

    /* ── STICKY TAB BAR ── */
    .tab-bar{
      position:sticky;top:58px;z-index:100;
      background:rgba(245,244,250,.92);
      backdrop-filter:blur(20px) saturate(180%);
      -webkit-backdrop-filter:blur(20px) saturate(180%);
      border-bottom:1px solid var(--border);
      display:flex;
      padding:0 16px;
    }
    .tab-btn{
      flex:1;
      padding:14px 0 12px;
      font-family:'Prompt',sans-serif;
      font-size:.92em;font-weight:700;
      color:var(--muted);
      background:none;border:none;
      border-bottom:2.5px solid transparent;
      cursor:pointer;
      transition:color .25s var(--ease), border-color .25s var(--ease);
      letter-spacing:0.01em;
    }
    .tab-btn.active{color:var(--pink);border-bottom-color:var(--pink)}

    /* ── TOP NAV (detail back bar) ── */
    #top-nav{
      display:none;
      position:sticky;top:0;z-index:150;
      background:rgba(18,18,30,.92);
      backdrop-filter:blur(24px) saturate(200%);
      -webkit-backdrop-filter:blur(24px) saturate(200%);
      border-bottom:1px solid rgba(255,255,255,.07);
      padding:10px 16px;
      align-items:center;gap:10px;
      box-shadow:0 2px 20px rgba(0,0,0,.2);
    }
    .back-btn{
      display:inline-flex;align-items:center;gap:5px;
      padding:8px 16px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      border-radius:30px;
      font-family:'Prompt',sans-serif;
      font-size:.82em;font-weight:700;
      color:#fff;
      cursor:pointer;
      transition:all .2s var(--ease);
    }
    .back-btn:hover{background:var(--pink);border-color:var(--pink)}
    .live-pill{
      display:inline-flex;align-items:center;gap:5px;
      font-size:.7em;font-weight:700;
      color:#16a34a;
      background:#dcfce7;
      border:1px solid #bbf7d0;
      padding:4px 10px;border-radius:20px;
    }
    .live-pill::before{
      content:'';width:6px;height:6px;
      background:#16a34a;border-radius:50%;
      animation:livepulse 1.8s ease infinite;
    }
    @keyframes livepulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}

    /* ── PAGE WRAPPER ── */
    .page{position:relative;z-index:1;padding:0 0 80px}

    /* ── SECTION HEADER ── */
    .section-head{
      padding:28px 20px 16px;
    }
    .section-title{
      font-size:1.9em;font-weight:800;
      color:var(--ink);
      letter-spacing:-0.02em;
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    }

    /* ── LOADING ── */
    .loading-state{
      display:flex;flex-direction:column;align-items:center;
      padding:80px 20px;gap:16px;
      color:var(--muted);font-size:.9em;font-weight:600;
    }
    .loader-ring{
      width:40px;height:40px;
      border:3px solid rgba(255,59,107,.15);
      border-top-color:var(--pink);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── CATEGORY TITLE ── */
    .cat-head{
      padding:24px 20px 10px;
      font-size:1.05em;font-weight:800;
      color:var(--ink);
      letter-spacing:0.01em;
      display:flex;align-items:center;gap:8px;
    }
    .cat-head::after{
      content:'';flex:1;height:1px;
      background:linear-gradient(90deg,var(--border) 0%,transparent 100%);
    }

    /* ── PRODUCT GRID ── */
    .product-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:14px;
      padding:0 16px 8px;
    }

    /* ── PRODUCT CARD ── */
    .pcard{
      background:var(--surface);
      border-radius:var(--r);
      overflow:hidden;
      cursor:pointer;
      box-shadow:0 2px 12px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      border:1px solid var(--border);
      transition:transform .3s var(--ease), box-shadow .3s var(--ease);
      animation:fadeUp .5s var(--ease) both;
    }
    .pcard:hover{
      transform:translateY(-6px) scale(1.01);
      box-shadow:0 16px 40px rgba(255,59,107,.14),0 4px 12px rgba(0,0,0,.06);
    }
    .pcard:active{transform:scale(.97)}
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }

    .pcard-img{
      width:100%;aspect-ratio:1/1;
      background:linear-gradient(135deg,#f8f7ff,#f0eef8);
      overflow:hidden;position:relative;
    }
    .pcard-img::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.5) 50%,transparent 100%);
      transform:translateX(-100%);
      animation:shimmer 1.8s ease infinite;
    }
    @keyframes shimmer{to{transform:translateX(200%)}}
    .pcard-img img{
      width:100%;height:100%;object-fit:cover;
      opacity:0;transition:opacity .4s var(--ease);
      position:relative;z-index:1;
      display:block;
    }
    .pcard-img img.loaded{opacity:1}
    .pcard-img .no-img{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      font-size:2em;opacity:.3;
    }

    .pcard-body{padding:12px 12px 14px}
    .pcard-name{
      font-size:.85em;font-weight:700;
      color:var(--ink);
      margin-bottom:3px;
      line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .pcard-price{
      font-size:.82em;font-weight:800;
      color:var(--pink);
      margin-bottom:10px;
    }
    .pcard-sku{font-size:.65em;color:var(--muted);margin-bottom:8px}
    .pcard-actions{display:flex;gap:5px;flex-wrap:wrap}

    /* ── GENERAL LIST ── */
    .general-list{
      display:flex;flex-direction:column;
      gap:8px;padding:0 16px 8px;
    }
    .gcard{
      background:var(--surface);
      border-radius:16px;
      display:flex;align-items:center;
      padding:16px 18px;
      cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      border:1px solid var(--border);
      gap:12px;
      transition:transform .25s var(--ease), box-shadow .25s var(--ease);
      animation:fadeUp .4s var(--ease) both;
    }
    .gcard:hover{
      transform:translateX(4px);
      box-shadow:0 6px 20px rgba(0,0,0,.08);
      border-color:rgba(255,59,107,.2);
    }
    .gcard:active{transform:scale(.98)}
    .gcard-icon{
      width:40px;height:40px;flex-shrink:0;
      background:linear-gradient(135deg,#fff0f3,#ffe4eb);
      border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-size:1.2em;
    }
    .gcard-text{flex:1;min-width:0}
    .gcard-name{
      font-size:.9em;font-weight:700;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .gcard-type{font-size:.68em;color:var(--muted);margin-top:1px}

    /* ── BUTTONS ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:4px;
      padding:7px 12px;
      border:none;border-radius:30px;
      font-family:'Prompt',sans-serif;
      font-size:.72em;font-weight:700;
      cursor:pointer;
      transition:all .2s var(--ease);
      white-space:nowrap;
    }
    .btn:active{transform:scale(.94)}
    .btn-ghost{
      background:rgba(0,0,0,.05);color:var(--ink2);
      border:1px solid var(--border);
    }
    .btn-ghost:hover{background:rgba(0,0,0,.1)}
    .btn-pink{
      background:linear-gradient(135deg,var(--pink2),var(--pink));
      color:#fff;
      box-shadow:0 4px 12px rgba(255,59,107,.3);
    }
    .btn-pink:hover{filter:brightness(1.08);box-shadow:0 6px 18px rgba(255,59,107,.4)}
    .btn-info{background:#fff0f3;color:#c0143c;border:1px solid #ffd0dd}
    .btn-info:hover{background:#ffe0e8}
    .btn-copy{background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd;min-width:64px}
    .btn-shopee{background:#fff3f0;color:#ee4d2d;border:1px solid #fecdc7}
    .btn-shopee:hover{background:#ee4d2d;color:#fff;border-color:#ee4d2d}
    .btn-tiktok{background:#f0f0f0;color:#010101;border:1px solid #ddd}
    .btn-tiktok:hover{background:#010101;color:#fff;border-color:#010101}
    .btn-loc{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
    .btn-laz{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
    .btn-laz:hover{background:#f97316;color:#fff;border-color:#f97316}
    .btn-p365{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .btn-p365:hover{background:#2563eb;color:#fff;border-color:#2563eb}
    .btn.copied{background:#dcfce7!important;color:#15803d!important;border-color:#86efac!important}

    /* ── DETAIL VIEW ── */
    .detail-page{
      animation:slideInRight .35s var(--ease) both;
    }
    @keyframes slideInRight{
      from{opacity:0;transform:translateX(24px)}
      to{opacity:1;transform:translateX(0)}
    }
    .detail-hero{
      position:relative;
      background:var(--surface);
      overflow:hidden;
    }
    .detail-img-wrap{
      width:100%;aspect-ratio:4/3;
      background:linear-gradient(135deg,#f8f7ff,#f0eef8);
      overflow:hidden;position:relative;
    }
    .detail-img-wrap img{
      width:100%;height:100%;object-fit:cover;
      opacity:0;transition:opacity .5s var(--ease);
    }
    .detail-img-wrap img.loaded{opacity:1}
    .detail-img-none{
      display:flex;align-items:center;justify-content:center;
      font-size:4em;opacity:.15;height:100%;
    }

    .detail-body{
      padding:20px 20px 0;
    }
    .detail-name{
      font-size:1.6em;font-weight:800;
      color:var(--ink);
      letter-spacing:-0.02em;
      line-height:1.2;
      margin-bottom:6px;
    }
    .detail-sku{font-size:.7em;color:var(--muted);margin-bottom:4px}
    .detail-type{
      display:inline-flex;align-items:center;
      background:rgba(255,59,107,.08);
      color:var(--pink);
      font-size:.75em;font-weight:700;
      padding:3px 10px;border-radius:20px;
      margin-bottom:12px;
    }
    .detail-price{
      font-size:1.4em;font-weight:800;
      color:var(--pink);
      margin-bottom:16px;
    }
    .detail-desc{
      font-size:.9em;line-height:1.75;
      color:#444;
      background:#f8f8fc;
      border-radius:14px;
      padding:16px;
      margin-bottom:18px;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .detail-action-row{
      display:flex;gap:8px;flex-wrap:wrap;
      margin-bottom:16px;
    }
    .detail-links{
      display:flex;gap:8px;flex-wrap:wrap;
      padding:0 20px 20px;
    }

    /* ── SIZE TABLE SECTION ── */
    .size-section{
      margin:0 20px 20px;
    }
    .size-section-title{
      font-size:.8em;font-weight:700;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:10px;
    }
    .size-img{
      width:100%;border-radius:16px;
      border:1px solid var(--border);
      object-fit:contain;
      opacity:0;transition:opacity .4s var(--ease);
    }
    .size-img.loaded{opacity:1}

    /* ── GENERAL DETAIL ── */
    .gdetail-body{padding:20px}
    .gdetail-name{
      font-size:1.5em;font-weight:800;color:var(--ink);
      letter-spacing:-0.02em;margin-bottom:6px;
    }
    .gdetail-type{
      display:inline-flex;
      background:rgba(99,102,241,.08);color:#4f46e5;
      font-size:.75em;font-weight:700;
      padding:3px 10px;border-radius:20px;margin-bottom:14px;
    }
    .gdetail-text{
      font-size:.9em;line-height:1.8;
      color:#333;
      background:#f8f8fc;
      border-radius:14px;padding:18px;
      white-space:pre-wrap;word-break:break-word;
      margin-bottom:18px;
    }
    .gdetail-img{width:100%;border-radius:16px;border:1px solid var(--border);margin-top:10px;}
    .gdetail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

    /* ── TYPE ICON MAP ── */
    .cat-badge{
      display:inline-block;
      background:var(--pink);color:#fff;
      font-size:.62em;font-weight:800;
      padding:2px 8px;border-radius:20px;
      margin-left:6px;vertical-align:middle;
    }

    @media(min-width:600px){
      .product-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
    }
    @media(min-width:900px){
      .product-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:0 24px 8px}
      .general-list{padding:0 24px 8px}
      .cat-head{padding:24px 24px 10px}
    }
  </style>
</head>
<body>

<!-- APP STORE TOPBAR -->
<header class="as-topbar" id="main-topbar">
  <div class="as-logo">
    <img src="https://i.postimg.cc/XNG0gfWq/image0.png" alt="LAMSANG" fetchpriority="high">
  </div>
  <span class="as-brand">App Store</span>
  <div class="as-search" onclick="document.getElementById('search-input').focus()">
    <span class="as-search-icon">🔍</span>
    <input id="search-input" type="text" placeholder="ค้นหาสินค้า..." oninput="handleSearch(this.value)">
  </div>
  <a href="admin.html" class="as-settings" title="Admin">⚙️</a>
</header>

<!-- TOP NAV (detail) -->
<div id="top-nav">
  <button class="back-btn" onclick="handleBack()">‹ กลับ</button>
  <span class="live-pill">Live</span>
</div>

<!-- MAIN -->
<div class="page">
  <!-- TAB BAR -->
  <div class="tab-bar" id="main-tabs">
    <button class="tab-btn active" id="tabProduct" onclick="switchTab('product')">คีย์ลัดสินค้า</button>
    <button class="tab-btn" id="tabGeneral" onclick="switchTab('general')">คีย์ลัดทั่วไป</button>
  </div>

  <!-- ── TAB: สินค้า ── -->
  <div id="tab-product-content">
    <div id="product-header" class="section-head">
      <div class="section-title">
        คีย์ลัดสินค้า
        <span class="live-pill">Live</span>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:.78em;font-weight:600;color:var(--muted)">เรียง</span>
        <select id="sortProduct" onchange="handleSortChange(this.value)" style="padding:7px 14px;border-radius:30px;border:1.5px solid var(--border);font-family:'Prompt',sans-serif;font-size:.8em;font-weight:700;color:var(--ink);background:var(--surface);cursor:pointer;outline:none">
          <option value="name_asc">ชื่อ (ก→ฮ)</option>
          <option value="price_asc">ราคา น้อย→มาก</option>
          <option value="price_desc">ราคา มาก→น้อย</option>
        </select>
      </div>
    </div>
    <div id="product-grid-view">
      <div class="loading-state"><div class="loader-ring"></div>กำลังโหลดสินค้า...</div>
    </div>
    <div id="product-details-view" style="display:none"></div>
  </div>

  <!-- ── TAB: ทั่วไป ── -->
  <div id="tab-general-content" style="display:none">
    <div id="general-header" class="section-head">
      <div class="section-title">คีย์ลัดทั่วไป <span class="live-pill">Live</span></div>
    </div>
    <div id="general-grid-view">
      <div class="loading-state"><div class="loader-ring"></div>กำลังโหลด...</div>
    </div>
    <div id="general-details-view" style="display:none"></div>
  </div>
</div>

<script>
// ── STATE ────────────────────────────────────────────────────
let productRows=[], generalRows=[];
let currentSort='name_asc', currentTab='product';
let searchQuery='';
const CAT_ICONS = {
  'เสื้อ':'👕','เสื้อยืด':'👕','เสื้อเชิ้ต':'👔','กางเกง':'👖',
  'กระโปรง':'👗','เข็มขัด':'🪡','รองเท้า':'👟','กระเป๋า':'👜',
  'ราคา':'💰','บริการ':'🛎️','ขนส่ง':'🚚','ทักทาย':'👋',
  'ปิดท้าย':'🙏','เนื้อผ้า':'🧵','ทั่วไป':'📋',
};
function catIcon(t) {
  for (const k in CAT_ICONS) if (t.includes(k)) return CAT_ICONS[k];
  return '📁';
}

function handleSearch(q) {
  searchQuery = q.toLowerCase().trim();
  if (currentTab==='product') renderProductGrid(productRows);
  else renderGeneralGrid(generalRows);
}

// ── FIREBASE ────────────────────────────────────────────────
function initFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.database();
  db.ref('products').on('value', snap => {
    const d = snap.val();
    productRows = d ? Object.values(d) : [];
    if (currentTab==='product') renderProductGrid(productRows);
  });
  db.ref('general').on('value', snap => {
    const d = snap.val();
    generalRows = d ? Object.values(d) : [];
    if (currentTab==='general') renderGeneralGrid(generalRows);
  });
}

// ── UTILS ───────────────────────────────────────────────────
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) }
function onImgLoad(img){ img.classList.add('loaded') }
function parsePrice(s){ return parseInt(String(s||'').replace(/[^0-9]/g,''))||0 }
function openLink(u){ if(u&&u.trim()) window.open(u.trim(),'_blank') }

function copyText(text, btn){
  const t = String(text||'').trim();
  if (!t||t==='undefined'){
    const o=btn.innerText; btn.innerText='ไม่มีข้อมูล';
    setTimeout(()=>btn.innerText=o,1000); return;
  }
  navigator.clipboard?.writeText(t).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
  });
  const o=btn.innerText; btn.innerText='✓ Copied!'; btn.classList.add('copied');
  setTimeout(()=>{ btn.innerText=o; btn.classList.remove('copied') },1400);
}

// ── PRODUCT GRID ────────────────────────────────────────────
function renderProductGrid(rows){
  const el = document.getElementById('product-grid-view');
  if (!rows?.length){ el.innerHTML='<div class="loading-state">ไม่พบข้อมูลสินค้า</div>'; return }

  // filter by search
  const filtered = searchQuery
    ? rows.filter((_,i) => {
        const r=rows[i];
        return (r[0]||'').toLowerCase().includes(searchQuery)
            || (r[1]||'').toLowerCase().includes(searchQuery)
            || (r[6]||'').toLowerCase().includes(searchQuery);
      })
    : rows;

  const map = {};
  filtered.forEach((r,fi)=>{
    // find original index in productRows
    const i = productRows.indexOf(r);
    const t = r[1]||'ไม่ระบุ';
    if (!map[t]) map[t]=[];
    map[t].push({i,name:r[0],price:r[2],priceNum:parsePrice(r[2]),img:r[4],sku:r[6]});
  });
  Object.values(map).forEach(arr=>arr.sort((a,b)=>
    currentSort==='name_asc'? a.name.localeCompare(b.name,'th')
    :currentSort==='price_asc'? a.priceNum-b.priceNum
    : b.priceNum-a.priceNum
  ));

  let html='';
  let delay=0;
  Object.keys(map).sort((a,b)=>a.localeCompare(b,'th')).forEach(type=>{
    html+=`<div class="cat-head">${catIcon(type)} ${esc(type)} <span class="cat-badge">${map[type].length}</span></div>`;
    html+=`<div class="product-grid">`;
    map[type].forEach(item=>{
      const img=item.img||'';
      const d=(delay%8)*60;
      html+=`<div class="pcard" style="animation-delay:${d}ms" onclick="showProductDetail(${item.i})">
        <div class="pcard-img">
          ${img
            ? `<img src="${img}" loading="lazy" onload="onImgLoad(this)">`
            : `<div class="no-img">📦</div>`}
        </div>
        <div class="pcard-body">
          <div class="pcard-name">${esc(item.name)}</div>
          <div class="pcard-price">${esc(item.price)}</div>
          <div class="pcard-actions">
            <button class="btn btn-info" onclick="event.stopPropagation();copyProductInfo(${item.i},this)">Copy</button>
            ${productRows[item.i]?.[7]?`<button class="btn btn-shopee" onclick="event.stopPropagation();openLink(productRows[${item.i}][7])">🛒</button>`:''}
            ${productRows[item.i]?.[8]?`<button class="btn btn-tiktok" onclick="event.stopPropagation();openLink(productRows[${item.i}][8])">♪</button>`:''}
            ${productRows[item.i]?.[10]?`<button class="btn btn-laz" onclick="event.stopPropagation();openLink(productRows[${item.i}][10])">🟠</button>`:''}
          </div>
        </div>
      </div>`;
      delay++;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

function copyProductInfo(idx,btn){
  const r=productRows[idx]; if(!r) return;
  copyText(`ชื่อสินค้า: ${r[0]}\nประเภท: ${r[1]}\nราคา: ${r[2]}\nรายละเอียด: ${r[3]}`,btn);
}

function showProductDetail(idx,push=true){
  const row=productRows[idx]; if(!row) return;
  if(push) history.pushState({view:'detail',tab:'product',idx},'');
  document.getElementById('product-grid-view').style.display='none';
  document.getElementById('main-tabs').style.display='none';
  document.getElementById('product-header').style.display='none';
  document.getElementById('main-topbar').style.display='none';
  document.getElementById('top-nav').style.display='flex';

  const copyTxt=`ชื่อสินค้า: ${row[0]}\nประเภท: ${row[1]}\nราคา: ${row[2]}\nรายละเอียด: ${row[3]}`;
  const shopee=row[7]||'', tiktok=row[8]||'', loc=row[9]||'', lazada=row[10]||'', page365=row[11]||'';

  let heroHtml='';
  if(row[4]){
    heroHtml=`<div class="detail-img-wrap"><img src="${row[4]}" onload="onImgLoad(this)" loading="lazy"></div>`;
  } else {
    heroHtml=`<div class="detail-img-wrap"><div class="detail-img-none">📦</div></div>`;
  }

  document.getElementById('product-details-view').innerHTML=`
    <div class="detail-page">
      <div class="detail-hero">${heroHtml}</div>
      <div class="detail-body">
        <div class="detail-name">${esc(row[0])}</div>
        ${row[6]?`<div class="detail-sku">SKU: ${esc(row[6])}</div>`:''}
        <div class="detail-type">${esc(row[1])}</div>
        <div class="detail-price">${esc(row[2])}</div>
        <div class="detail-action-row">
          <button class="btn btn-pink" onclick='copyText(${JSON.stringify(copyTxt)},this)'>📋 Copy ข้อความ</button>
          ${shopee?`<button class="btn btn-shopee" onclick="openLink('${shopee}')">🛒 Shopee</button>`:''}
          ${tiktok?`<button class="btn btn-tiktok" onclick="openLink('${tiktok}')">♪ TikTok</button>`:''}
          ${lazada?`<button class="btn btn-laz" onclick="openLink('${lazada}')">🟠 Lazada</button>`:''}
          ${page365?`<button class="btn btn-p365" onclick="openLink('${page365}')">📄 Page365</button>`:''}
          ${loc?`<button class="btn btn-loc" onclick="openLink('${loc}')">📍 พิกัด</button>`:''}
        </div>
        <div class="detail-desc">${esc(String(row[3]||''))}</div>
      </div>
      ${row[5]?`<div class="size-section"><div class="size-section-title">📏 ตารางไซส์</div><img class="size-img" src="${row[5]}" onload="onImgLoad(this)" loading="lazy"></div>`:''}
    </div>`;
  document.getElementById('product-details-view').style.display='block';
  window.scrollTo(0,0);
}

// ── GENERAL GRID ────────────────────────────────────────────
function renderGeneralGrid(rows){
  const el = document.getElementById('general-grid-view');
  if (!rows?.length){ el.innerHTML='<div class="loading-state">ไม่พบข้อมูล</div>'; return }

  const filtered = searchQuery
    ? rows.filter(r =>
        (r[1]||'').toLowerCase().includes(searchQuery)
     || (r[0]||'').toLowerCase().includes(searchQuery)
     || (r[2]||'').toLowerCase().includes(searchQuery))
    : rows;

  if (!filtered.length){ el.innerHTML=`<div class="loading-state">🔍 ไม่พบ "${searchQuery}"</div>`; return }

  const map={};
  filtered.forEach((r)=>{
    const i = generalRows.indexOf(r);
    const t=r[0]||'ทั่วไป';
    if(!map[t])map[t]=[];
    map[t].push({i,name:r[1]});
  });

  let html=''; let delay=0;
  Object.keys(map).sort((a,b)=>a.localeCompare(b,'th')).forEach(type=>{
    html+=`<div class="cat-head">${catIcon(type)} ${esc(type)} <span class="cat-badge">${map[type].length}</span></div>`;
    html+=`<div class="general-list">`;
    map[type].forEach(item=>{
      const d=(delay%6)*50;
      html+=`<div class="gcard" style="animation-delay:${d}ms" onclick="showGeneralDetail(${item.i})">
        <div class="gcard-icon">${catIcon(type)}</div>
        <div class="gcard-text">
          <div class="gcard-name">${esc(item.name)}</div>
          <div class="gcard-type">${esc(type)}</div>
        </div>
        <button class="btn btn-copy" onclick="event.stopPropagation();copyText(generalRows[${item.i}]?.[2],this)">Copy</button>
      </div>`;
      delay++;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

function showGeneralDetail(idx,push=true){
  const row=generalRows[idx]; if(!row) return;
  if(push) history.pushState({view:'detail',tab:'general',idx},'');
  document.getElementById('general-grid-view').style.display='none';
  document.getElementById('main-tabs').style.display='none';
  document.getElementById('general-header').style.display='none';
  document.getElementById('main-topbar').style.display='none';
  document.getElementById('top-nav').style.display='flex';

  const imgHtml=row[3]?`<img class="gdetail-img" src="${row[3]}" onload="onImgLoad(this)" loading="lazy">`:'';
  document.getElementById('general-details-view').innerHTML=`
    <div class="detail-page gdetail-body">
      <div class="gdetail-name">${esc(row[1])}</div>
      <div class="gdetail-type">${catIcon(row[0])} ${esc(row[0])}</div>
      <div class="gdetail-actions">
        <button class="btn btn-pink" onclick='copyText(${JSON.stringify(String(row[2]||''))},this)'>📋 Copy ข้อความ</button>
      </div>
      <div class="gdetail-text">${esc(String(row[2]||''))}</div>
      ${imgHtml}
    </div>`;
  document.getElementById('general-details-view').style.display='block';
  window.scrollTo(0,0);
}

// ── TABS / NAVIGATION ────────────────────────────────────────
function switchTab(tab,push=true){
  currentTab=tab;
  document.getElementById('tabProduct').classList.toggle('active',tab==='product');
  document.getElementById('tabGeneral').classList.toggle('active',tab==='general');
  document.getElementById('tab-product-content').style.display=tab==='product'?'block':'none';
  document.getElementById('tab-general-content').style.display=tab==='general'?'block':'none';
  if(tab==='product') showProductGrid(push); else showGeneralGrid(push);
}
function showProductGrid(push=true){
  document.getElementById('product-grid-view').style.display='block';
  document.getElementById('product-details-view').style.display='none';
  document.getElementById('main-tabs').style.display='flex';
  document.getElementById('product-header').style.display='block';
  document.getElementById('main-topbar').style.display='flex';
  document.getElementById('top-nav').style.display='none';
  if(push) history.pushState({view:'grid',tab:'product'},'');
}
function showGeneralGrid(push=true){
  document.getElementById('general-grid-view').style.display='block';
  document.getElementById('general-details-view').style.display='none';
  document.getElementById('main-tabs').style.display='flex';
  document.getElementById('general-header').style.display='block';
  document.getElementById('main-topbar').style.display='flex';
  document.getElementById('top-nav').style.display='none';
  if(push) history.pushState({view:'grid',tab:'general'},'');
}
function handleBack(){ history.length>1?history.back():(currentTab==='product'?showProductGrid():showGeneralGrid()) }
function handleSortChange(v){ currentSort=v; renderProductGrid(productRows) }
window.onpopstate=e=>{
  if(!e.state) return;
  const s=e.state;
  if(s.view==='detail'){if(s.tab==='product')showProductDetail(s.idx,false);else showGeneralDetail(s.idx,false)}
  else switchTab(s.tab||'product',false);
};
document.addEventListener('DOMContentLoaded',()=>{
  history.replaceState({view:'grid',tab:'product'},'');
  initFirebase();
});
</script>
